name: Normalize About Links

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Normalize app-owned About links
        run: |
          python3 - <<'PY'
          from pathlib import Path

          about = Path('app/src/main/java/dev/arnv/bluke/AboutActivity.kt')
          text = about.read_text()
          text = text.replace(
              'openUrl("https://github.com/Loverof-Darkness")',
              'openUrl("https://github.com/Loverof-Darkness/Devil-RemoteBT-Keyboard")',
          )
          about.write_text(text)

          licenses = Path('app/src/main/java/dev/arnv/bluke/LicensesActivity.kt')
          text = licenses.read_text()
          text = text.replace('text = "Bluke"', 'text = "Devil RemoteBT Keyboard"', 1)
          text = text.replace(
              'https://github.com/arnav-kr/Bluke',
              'https://github.com/Loverof-Darkness/Devil-RemoteBT-Keyboard',
              1,
          )
          text = text.replace(
              'https://raw.githubusercontent.com/arnav-kr/Bluke/main/LICENSE',
              'https://raw.githubusercontent.com/Loverof-Darkness/Devil-RemoteBT-Keyboard/main/LICENSE',
              1,
          )
          licenses.write_text(text)
          PY

      - name: Commit normalized About section
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/dev/arnv/bluke/AboutActivity.kt app/src/main/java/dev/arnv/bluke/LicensesActivity.kt
          if git diff --cached --quiet; then
            echo "No About changes needed."
          else
            git commit -m "fix: route app-owned about links to project repo"
            git push
          fi

      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/about-normalize.yml
          git commit -m "chore: remove one-time about normalization workflow"
          git push
