name: Build Android

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sync exact Bluke baseline once
        run: |
          if [ "$(git log -1 --pretty=%s)" = "sync: apply Bluke baseline with native IME" ]; then
            exit 0
          fi
          curl -L --fail --retry 3 https://github.com/arnav-kr/Bluke/archive/refs/heads/main.tar.gz -o /tmp/bluke.tar.gz
          mkdir /tmp/bluke
          tar -xzf /tmp/bluke.tar.gz -C /tmp/bluke --strip-components=1
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/' /tmp/bluke/ ./
          python3 - <<'PY'
          from pathlib import Path
          import re

          manager = Path('app/src/main/java/dev/arnv/bluke/bluetooth/BluetoothKeyboardManager.kt')
          text = manager.read_text()
          marker = '\n    fun close('
          method = r'''
              /** Extra native Android IME bridge. Bluke's original HID path remains unchanged. */
              fun sendText(text: String): Int {
                  var sent = 0
                  for (ch in text.replace("\\r\\n", "\\n").replace('\\r', '\\n')) {
                      val mapping = asciiHidMapping(ch) ?: continue
                      val (keyCode, shifted) = mapping
                      if (shifted) sendKey(0xE1, true)
                      sendKey(keyCode, true)
                      sendKey(keyCode, false)
                      if (shifted) sendKey(0xE1, false)
                      sent++
                  }
                  return sent
              }

              private fun asciiHidMapping(ch: Char): Pair<Int, Boolean>? {
                  return when (ch) {
                      in 'a'..'z' -> (0x04 + (ch - 'a')) to false
                      in 'A'..'Z' -> (0x04 + (ch.lowercaseChar() - 'a')) to true
                      in '1'..'9' -> (0x1E + (ch - '1')) to false
                      '0' -> 0x27 to false
                      ' ' -> 0x2C to false
                      '-' -> 0x2D to false
                      '_' -> 0x2D to true
                      '=' -> 0x2E to false
                      '+' -> 0x2E to true
                      '[' -> 0x2F to false
                      '{' -> 0x2F to true
                      ']' -> 0x30 to false
                      '}' -> 0x30 to true
                      '\\\\' -> 0x31 to false
                      '|' -> 0x31 to true
                      ';' -> 0x33 to false
                      ':' -> 0x33 to true
                      '\'' -> 0x34 to false
                      '"' -> 0x34 to true
                      '`' -> 0x35 to false
                      '~' -> 0x35 to true
                      ',' -> 0x36 to false
                      '<' -> 0x36 to true
                      '.' -> 0x37 to false
                      '>' -> 0x37 to true
                      '/' -> 0x38 to false
                      '?' -> 0x38 to true
                      '!' -> 0x1E to true
                      '@' -> 0x1F to true
                      '#' -> 0x20 to true
                      '$' -> 0x21 to true
                      '%' -> 0x22 to true
                      '^' -> 0x23 to true
                      '&' -> 0x24 to true
                      '*' -> 0x25 to true
                      '(' -> 0x26 to true
                      ')' -> 0x27 to true
                      '\\n' -> 0x28 to false
                      '\\t' -> 0x2B to false
                      else -> null
                  }
              }
          '''
          if marker not in text:
              raise SystemExit('BluetoothKeyboardManager close() marker not found')
          text = text.replace(marker, '\n' + method + marker, 1)
          manager.write_text(text)

          ui = Path('app/src/main/java/dev/arnv/bluke/ui/HomeScreen.kt')
          text = ui.read_text()
          # Remove any previous malformed insertion, then add the extra field as the first LazyColumn item.
          malformed = re.compile(
              r'\n\s*item\s*\{\s*NativeKeyboardInput\(\s*enabled\s*=\s*isConnected,\s*onSend\s*=\s*btManager::sendText\s*\)\s*\}\s*(?=contentPadding)'
          )
          text, removed = malformed.subn('\n                            ', text, count=1)
          if removed > 1:
              raise SystemExit('Unexpected duplicate native input blocks')

          header = re.compile(
              r'(LazyColumn\(.*?verticalArrangement\s*=\s*Arrangement\.spacedBy\(16\.dp\)\s*\)\s*\{)',
              re.DOTALL
          )
          replacement = r'''\1
                            item {
                                NativeKeyboardInput(
                                    enabled = isConnected,
                                    onSend = btManager::sendText
                                )
                            }'''
          text, count = header.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Bluke HomeScreen LazyColumn header not found')
          ui.write_text(text)
          PY
          rm -f .github/workflows/sync-bluke.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "sync: apply Bluke baseline with native IME"
          git push

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"

      - name: Build and lint
        run: gradle clean lintDebug assembleDebug assembleRelease --stacktrace

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: devil-remotebt-keyboard-apks-${{ github.sha }}
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
