name: Build Android

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fix native HID text pacing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manager = Path('app/src/main/java/dev/arnv/bluke/bluetooth/BluetoothKeyboardManager.kt')
          text = manager.read_text()

          if 'private val nativeTextSendMutex' not in text:
              marker = 'import kotlinx.coroutines.flow.MutableSharedFlow\n'
              if marker not in text:
                  raise SystemExit('MutableSharedFlow import marker not found')
              text = text.replace(marker, marker + 'import kotlinx.coroutines.sync.Mutex\nimport kotlinx.coroutines.sync.withLock\n', 1)

              marker = '    private val connectionStateFlow = MutableSharedFlow<Pair<BluetoothDevice, Int>>('
              if marker not in text:
                  raise SystemExit('connectionStateFlow marker not found')
              text = text.replace(marker, '    private val nativeTextSendMutex = Mutex()\n\n' + marker, 1)

          start = text.find('    /** Extra native Android IME bridge.')
          end = text.find('    fun close()', start)
          if start == -1 or end == -1:
              raise SystemExit('Native sendText block not found')

          method = r'''    /** Extra native Android IME bridge. Bluke's original HID path remains unchanged. */
              fun sendText(text: String): Int {
                  val mappings = text
                      .replace("\r\n", "\n")
                      .replace('\r', '\n')
                      .mapNotNull { ch -> asciiHidMapping(ch) }

                  if (mappings.isEmpty()) return 0

                  managerScope.launch(Dispatchers.IO) {
                      nativeTextSendMutex.withLock {
                          for ((keyCode, shifted) in mappings) {
                              if (shifted) {
                                  sendKey(0xE1, true)
                                  delay(8)
                              }
                              sendKey(keyCode, true)
                              delay(8)
                              sendKey(keyCode, false)
                              delay(8)
                              if (shifted) {
                                  sendKey(0xE1, false)
                                  delay(8)
                              }
                          }
                      }
                  }
                  return mappings.size
              }

              private fun asciiHidMapping(ch: Char): Pair<Int, Boolean>? {
                  return when (ch) {
                      in 'a'..'z' -> (0x04 + (ch - 'a')) to false
                      in 'A'..'Z' -> (0x04 + (ch.lowercaseChar() - 'a')) to true
                      in '1'..'9' -> (0x1E + (ch - '1')) to false
                      '0' -> 0x27 to false
                      ' ' -> 0x2C to false
                      '-' -> 0x2D to false
                      '_' -> 0x2D to true
                      '=' -> 0x2E to false
                      '+' -> 0x2E to true
                      '[' -> 0x2F to false
                      '{' -> 0x2F to true
                      ']' -> 0x30 to false
                      '}' -> 0x30 to true
                      '\\' -> 0x31 to false
                      '|' -> 0x31 to true
                      ';' -> 0x33 to false
                      ':' -> 0x33 to true
                      '\'' -> 0x34 to false
                      '"' -> 0x34 to true
                      '`' -> 0x35 to false
                      '~' -> 0x35 to true
                      ',' -> 0x36 to false
                      '<' -> 0x36 to true
                      '.' -> 0x37 to false
                      '>' -> 0x37 to true
                      '/' -> 0x38 to false
                      '?' -> 0x38 to true
                      '!' -> 0x1E to true
                      '@' -> 0x1F to true
                      '#' -> 0x20 to true
                      '$' -> 0x21 to true
                      '%' -> 0x22 to true
                      '^' -> 0x23 to true
                      '&' -> 0x24 to true
                      '*' -> 0x25 to true
                      '(' -> 0x26 to true
                      ')' -> 0x27 to true
                      '\n' -> 0x28 to false
                      '\t' -> 0x2B to false
                      else -> null
                  }
              }

          '''
          text = text[:start] + method + text[end:]
          manager.write_text(text)
          PY

      - name: Commit native input fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/dev/arnv/bluke/bluetooth/BluetoothKeyboardManager.kt
          if git diff --cached --quiet; then
            echo "No native input source changes to commit."
          else
            git commit -m "fix: pace native HID text reports"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"

      - name: Create temporary CI release keystore
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /tmp/ci-key.pem \
            -out /tmp/ci-cert.pem \
            -days 3650 \
            -subj "/CN=Devil RemoteBT Keyboard/OU=CI/O=Loverof-Darkness/C=US"
          openssl pkcs12 -export \
            -out my-upload-key.jks \
            -inkey /tmp/ci-key.pem \
            -in /tmp/ci-cert.pem \
            -name k0 \
            -passout pass:android

      - name: Build
        env:
          STORE_PASSWORD: android
          KEY_PASSWORD: android
          KEY_ALIAS: k0
        run: gradle clean assembleDebug assembleRelease --stacktrace

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: devil-remotebt-keyboard-apks-${{ github.sha }}
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
