name: Release Android APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"

      - name: Build release APK
        run: gradle clean lintDebug assembleRelease --stacktrace

      - name: Locate release APK
        id: apk
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Prepare release source archive
        id: source
        shell: bash
        run: |
          SOURCE="Devil-RemoteBT-Keyboard-${GITHUB_REF_NAME}-source.zip"
          git archive --format=zip --output="$SOURCE" "$GITHUB_REF_NAME"
          test -s "$SOURCE"
          echo "path=$SOURCE" >> "$GITHUB_OUTPUT"

      - name: Prepare release checksums
        id: checksums
        shell: bash
        run: |
          APK="${{ steps.apk.outputs.path }}"
          SOURCE="${{ steps.source.outputs.path }}"
          APK_NAME="Devil-RemoteBT-Keyboard-${GITHUB_REF_NAME}-release.apk"
          cp "$APK" "$APK_NAME"
          sha256sum "$APK_NAME" "$SOURCE" > "SHA256SUMS.txt"
          echo "path=SHA256SUMS.txt" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "Devil-RemoteBT-Keyboard-${GITHUB_REF_NAME}-release.apk" \
            "${{ steps.source.outputs.path }}" \
            "${{ steps.checksums.outputs.path }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --generate-notes \
            --title "Devil RemoteBT Keyboard ${GITHUB_REF_NAME}"
